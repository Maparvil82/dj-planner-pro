name: App checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:community-safety-db
      - run: npm run test:account-deletion-db
      - run: npm run test:storage-db
      - run: npm run test:performance-db
      - run: npm run test:door-access-db
